apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: roomsync
spec:
  accessModes:
    - ReadWriteOnce
  # "standard" is this cluster's confirmed default StorageClass
  # (rancher.io/local-path, kind's local-path-provisioner).
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: roomsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  # Single replica + PVC (not a StatefulSet) - fine for one Mongo instance in
  # a demo; a StatefulSet would be the real choice if this ever needed to
  # scale to a replica set.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          # Same check docker-compose.yml already used. timeoutSeconds bumped from
          # the implicit 1s default - an exec probe spawns a fresh mongosh (Node-based)
          # process on every single check, which can exceed 1s under real resource
          # contention (confirmed live: repeated CrashLoopBackOff from probe timeouts
          # while another heavy workload was running on the same host, not any actual
          # mongod failure - its own logs showed clean, graceful shutdowns each time).
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: roomsync
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
