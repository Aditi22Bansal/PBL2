apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: roomsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          # v1 baseline - the commit SHA CI actually built and pushed this from.
          image: ghcr.io/aditi22bansal/pbl2-python-service:d54c56930b7ea963a3c8ebe0e468fefc82c3b1de
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: roomsync
spec:
  # Internal only - backend is the only caller (see
  # backend/services/allocationService.js).
  type: ClusterIP
  selector:
    app: python-service
  ports:
    - port: 8000
      targetPort: 8000
