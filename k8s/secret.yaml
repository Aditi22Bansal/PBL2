# DEMO PLACEHOLDER ONLY - not a real secret, and not committed as one. Mirrors
# docker-compose.yml's own "docker-compose-dev-secret-change-me" dev-only value.
# A real deployment would create this with `kubectl create secret generic` (or a
# secrets manager / sealed-secrets / external-secrets operator) from an actual
# random value, and would never check the real value into version control -
# stringData here is plaintext specifically so that's obvious at a glance, since
# Kubernetes Secrets are only base64-ENCODED by the API, not encrypted, so
# committing a real one this way would be exactly as unsafe as committing plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: roomsync-secret
  namespace: roomsync
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_ME_NOT_A_REAL_SECRET_k8s-demo-placeholder"
  # Shared secret between backend and python-service (see backend/main.py's
  # require_internal_service_key middleware) - a Secret, not the shared ConfigMap,
  # since it's credential-shaped even though this particular value is a placeholder.
  INTERNAL_SERVICE_KEY: "REPLACE_ME_NOT_A_REAL_SECRET_k8s-internal-key-placeholder"
